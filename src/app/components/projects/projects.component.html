<section class="projects-section" [class.visible]="isVisible">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Projects</span>
      <h2 class="section-title">Featured Work</h2>
      <p class="section-subtitle">A selection of projects that showcase my skills and expertise</p>
    </div>

    <div class="projects-grid">
      @for (project of projects; track project.title; let i = $index) {
        <div class="project-card" [style.animation-delay]="(i * 100) + 'ms'">
          <div class="card-image">
            <img class="card-icon" [src]="project.image" [alt]="project.title" />
            <div class="card-overlay">
              <a href="#" class="view-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                  <polyline points="15 3 21 3 21 9"/>
                  <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
              </a>
            </div>
          </div>
          <div class="card-content">
            <h3 class="card-title">{{ project.title }}</h3>
            <p class="card-desc">{{ project.description }}</p>
            <div class="card-tags">
              @for (tag of project.tags; track tag) {
                <span class="tag">{{ tag }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
