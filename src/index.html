<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Asfandyar - Web Developer & AI Automation Expert</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var accent = localStorage.getItem('portfolio-accent');
        var mode = localStorage.getItem('portfolio-theme-mode');
        var validAccents = ['blue', 'gray', 'green', 'purple', 'pink'];
        if (validAccents.indexOf(accent) !== -1) {
          document.documentElement.setAttribute('data-accent', accent);
        }
        document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
